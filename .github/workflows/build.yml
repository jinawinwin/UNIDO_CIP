name: build-and-deploy-dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 3 1 * *"   # monthly refresh
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: python -m playwright install --with-deps chromium
      - name: Crawl data, run analysis, build dashboard + PDF
        env: { PYTHONPATH: src }
        run: python -m cipdash.pipeline --fetch --out site
      - name: Keep crawler discovery log for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawl-log
          path: data/raw/unido/_discovery.json
          if-no-files-found: ignore
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
