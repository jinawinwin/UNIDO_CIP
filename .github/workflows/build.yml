name: build-and-deploy-dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 3 1 * *"   # monthly refresh
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: python -m playwright install --with-deps chromium
      - name: Fetch World Bank data, run analysis, build dashboard + PDF
        shell: bash
        env: { PYTHONPATH: src }
        run: python -m cipdash.pipeline --fetch --out site 2>&1 | tee pipeline.log
      - name: Publish diagnostics to the crawl-log branch
        if: always()
        run: |
          mkdir -p /tmp/diag
          cp pipeline.log /tmp/diag/ 2>/dev/null || true
          cp data/raw/unido/_discovery.json data/raw/unido/portal.png /tmp/diag/ 2>/dev/null || true
          ls -la data/raw data/raw/unido data/raw/wb > /tmp/diag/files.txt 2>&1 || true
          cd /tmp/diag && git init -q -b crawl-log && git config user.name github-actions && git config user.email actions@github.com
          git add -A && git commit -q -m "diagnostics" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" crawl-log
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
